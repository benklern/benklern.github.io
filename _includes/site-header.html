{% assign home = '/' | relative_url %}
<header class="topbar">
  <a class="topbar__id" href="{{ home }}">
    <img class="topbar__avatar" src="{{ site.author.photo | relative_url }}" alt="" width="44" height="44">
    <span class="topbar__text">
      <span class="topbar__name">{{ site.author.name }}</span>
      <span class="topbar__role">{{ site.author.role }} · {{ site.author.employer }}</span>
    </span>
  </a>
  <nav class="topbar__nav" aria-label="Main">
    {% include nav-links.html %}
  </nav>
  <button class="menu-button" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="menu-drawer">
    <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
</header>
