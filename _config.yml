# Site settings
title: "Noam Benkler"
description: "AI research scientist working across LLM evaluation, machine learning on wearable physiological data, and multi-agent systems."
url: "https://benklern.github.io"
baseurl: ""
locale: "en-US"
theme: null  # no gem theme; styles live in assets/css/site.css
timezone: America/New_York

# Shown in the hero, top bar and footer
author:
  name: "Noam Benkler"
  role: "AI Research Scientist"
  employer: "SIFT"
  employer_url: "https://www.sift.net/"
  location: "Burlington, VT"
  email: "nbenkler@sift.net"
  photo: "/images/profile.jpg"
  statement: "I build AI that understands people and does real work: NLP that surfaces the values in text, transformer models that read stress from wearable signals, and multi-agent systems that port real-world code."
  googlescholar: "https://scholar.google.com/citations?user=mup4_VAAAAAJ"
  semantic: "https://www.semanticscholar.org/author/Noam-Benkler/2139850598"
  orcid: "https://orcid.org/0009-0002-7927-6482"
  github: "benklern"

# Content
collections:
  publications:
    output: true
    permalink: /publication/:path/

defaults:
  - scope: { path: "", type: publications }
    values: { layout: publication }
  - scope: { path: "", type: posts }
    values: { layout: page }
  - scope: { path: "", type: pages }
    values: { layout: page }

include:
  - _pages
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
  - .bundle

permalink: /:categories/:title/
markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: lsquo,rsquo,ldquo,rdquo

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
